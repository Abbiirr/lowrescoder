title: Ask user scripted response
category: backend_feature
difficulty: medium
target_stack:
  language: python
task_spec:
  prompt: |
    I need a function that processes a list of numbers, but I'm not sure about the output format.
    Should it return a list of results or a dictionary mapping input to output?
    Please ask me to clarify, then implement the solution based on my preference.
    The function should be called process_numbers and take a list of integers.
    Each number should be squared if it's even, or cubed if it's odd.
repo_seed:
  mode: fresh
  files:
    test_processor.py: |
      from processor import process_numbers

      def test_even_numbers():
          result = process_numbers([2, 4, 6])
          assert result == [4, 16, 36]

      def test_odd_numbers():
          result = process_numbers([1, 3, 5])
          assert result == [1, 27, 125]

      def test_mixed():
          result = process_numbers([1, 2, 3])
          assert result == [1, 4, 27]

      def test_empty():
          result = process_numbers([])
          assert result == []
expected_outcomes:
  must_have:
    - "item_completed event present"
  must_not_have: []
trajectory_assertions:
  must_use_tools:
    - "ask_user"
  min_tool_calls: 1
artifact_assertions:
  require_non_empty_diff: true
  forbid_noop_pass: true
  must_not_change_files:
    - "test_processor.py"
grading:
  checks:
    - run_tests
  check_commands:
    run_tests: "python -m pytest test_processor.py -v"
