title: Simple edit and verify diff
category: backend_feature
difficulty: easy
target_stack:
  language: python
task_spec:
  prompt: |
    Create a file called hello.py with the content: print("hello world")
    Then verify it exists by reading it back.
repo_seed:
  mode: fresh
expected_outcomes:
  must_have:
    - "item_completed event present"
    - "turn_completed event with usage"
  must_not_have:
    - "error event"
trajectory_assertions:
  must_use_tool_families:
    - "file_write"
    - "file_read"
  min_tool_calls: 2
artifact_assertions:
  require_non_empty_diff: true
  must_change_files:
    - "hello.py"
  must_contain_text:
    hello.py:
      - "hello world"
grading:
  checks:
    - snapshot
  check_commands:
    snapshot: "test -f hello.py && grep -q 'hello world' hello.py"
