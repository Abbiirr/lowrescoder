title: Turn completion with usage reporting
category: backend_feature
difficulty: easy
target_stack:
  language: python
task_spec:
  prompt: |
    Say "usage check passed" and nothing else.
repo_seed:
  mode: fresh
expected_outcomes:
  must_have:
    - "turn_completed event with usage"
    - "thread_started event present"
  must_not_have:
    - "error event"
grading:
  checks:
    - snapshot
  check_commands:
    snapshot: "true"
