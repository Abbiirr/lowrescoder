<title>AutoCode — IDE prototype</title>
<!--
  Implementation of AutoCode.dc.html (Claude Design project "IDE with intellisense redesign").
  Self-contained vanilla JS — no build step, no runtime deps. Open directly in a browser.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#05060a}
::selection{background:rgba(120,150,255,.3)}
::placeholder{color:var(--t3);opacity:1}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(128,140,170,.25);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes dots{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
input,textarea,button{font:inherit;color:inherit}
button{background:none;border:none;padding:0;cursor:pointer;text-align:left}
input:focus,textarea:focus{outline:none}
/* hover/active utilities — !important so they win over inline base styles */
.hv:hover{background:var(--hov)!important}
.hvt:hover{background:var(--hov)!important;color:var(--t1)!important}
.hvc:hover{color:var(--t1)!important}
.hva:hover{color:var(--acc)!important}
.hvo:hover{opacity:.75!important}
.hvb:hover{filter:brightness(1.12)!important}
.hvbd:hover{border-color:var(--line2)!important}
.hvcb:hover{background:var(--hov)!important;border-color:var(--line2)!important}
.hvtb:hover{background:var(--hov)!important;color:var(--t1)!important;border-color:var(--line2)!important}
.hverr:hover{opacity:1!important;text-decoration:underline!important}
.a92:active{transform:scale(.92)!important}
.a93:active{transform:scale(.93)!important}
.a95:active{transform:scale(.95)!important}

/* ---------- render with focus/scroll preservation ---------- */
function render(){
  var appEl = document.getElementById('app');
  var act = document.activeElement;
  var focusId = (act && act.id) ? act.id : null;
  var selS = null, selE = null;
  if (focusId && (act.tagName==='INPUT' || act.tagName==='TEXTAREA')) { selS = act.selectionStart; selE = act.selectionEnd; }
  var scrolls = {};
  var nodes = appEl.querySelectorAll('[data-scroll]');
  for (var i=0;i<nodes.length;i++) scrolls[nodes[i].getAttribute('data-scroll')] = { t:nodes[i].scrollTop, l:nodes[i].scrollLeft };
  appEl.innerHTML = view();
  nodes = appEl.querySelectorAll('[data-scroll]');
  for (var j=0;j<nodes.length;j++) {
    var s = scrolls[nodes[j].getAttribute('data-scroll')];
    if (s) { nodes[j].scrollTop = s.t; nodes[j].scrollLeft = s.l; }
  }
  if (focusId) {
    var el = document.getElementById(focusId);
    if (el) { el.focus(); if (selS !== null && el.setSelectionRange) { try { el.setSelectionRange(selS, selE); } catch(e){} } }
  }
}
function scrollChatBottom(){
  var el = document.querySelector('[data-scroll="chat"]');
  if (el) el.scrollTop = el.scrollHeight;
}

/* ---------- behaviors ---------- */
function toast(msg){
  var id = ++toastSeq;
  state.toasts = state.toasts.concat([{ id:id, msg:msg }]);
  render();
  setTimeout(function(){ state.toasts = state.toasts.filter(function(t){ return t.id !== id; }); render(); }, 2600);
}
function focusHome(){ var el = document.getElementById('i-home'); if (el) el.focus(); }
function acceptGhost(){ if (state.ghostDone) return; state.ghostDone = true; render(); toast('Inline suggestion accepted · Tab'); }
function acceptCompl(){
  var it = COMPL[state.complIdx];
  if (it.n==='endsAt') { state.l22 = 'fixed'; render(); toast('Quick fix applied — 0 problems'); }
  else { state.l22 = 'error'; render(); toast('Inserted .' + it.n); }
}
function send(which){
  var key = which==='home' ? 'composerHome' : 'composerThread';
  var text = (state[key]||'').trim();
  if (!text) return;
  if (which==='home') {
    var id = 'nt' + Date.now();
    var th = { id:id, title: text.length>44 ? text.slice(0,44)+'…' : text, rows:[{kind:'user',text:text}], meta:'worktree · '+state.model+' · just now', running:true, group:'active' };
    state.newThreads = [th].concat(state.newThreads);
    state.composerHome = '';
    state.view = 'thread'; state.threadId = id; state.tab = 'chat'; state.editorOpen = false; state.reviewOpen = false;
    state.thinking[id] = true;
    render(); scrollChatBottom();
    setTimeout(function(){
      state.newThreads = state.newThreads.map(function(t){
        return t.id===id ? Object.assign({}, t, { rows: t.rows.concat([{ kind:'plan', title:'Plan', steps:[{t:'Understand the request',s:'done'},{t:'Locate relevant code',s:'now'},{t:'Implement and verify',s:'todo'}] }]) }) : t;
      });
      state.thinking[id] = false;
      render(); scrollChatBottom();
      toast('Thread started in a worktree');
    }, 1500);
  } else {
    var tid = state.threadId;
    state.composerThread = '';
    state.extras[tid] = (state.extras[tid]||[]).concat([{kind:'user',text:text}]);
    state.thinking[tid] = true;
    render(); scrollChatBottom();
    setTimeout(function(){
      state.extras[tid] = (state.extras[tid]||[]).concat([{ kind:'answer', paras:['Noted — folding that into the current plan.'], meta:state.model+' · 2s', actions:[] }]);
      state.thinking[tid] = false;
      render(); scrollChatBottom();
    }, 1300);
  }
}

    set({permPolicy:id});
    var name = ''; for (var i=0;i<PERM_CARDS.length;i++) if (PERM_CARDS[i].id===id) name = PERM_CARDS[i].name;
    toast('Approval policy: ' + name);
  },
  togglePerm: function(key){ state[key] = !state[key]; render(); },
  mcpToggle: function(id){
    if (id==='github') state.mcpGithub = !state.mcpGithub;
    else if (id==='pg') state.mcpPg = !state.mcpPg;
    else state.mcpStripe = 'error';
    render();
  },
  mcpReconnect: function(){ set({mcpStripe:'connecting'}); setTimeout(function(){ set({mcpStripe:'ok'}); toast('stripe-fixtures connected'); }, 1100); },
  billing: function(){ toast('Billing portal (demo)'); },
  addServer: function(){ toast('MCP server wizard (demo)'); }
};

/* ---------- global keyboard (editor IntelliSense demo) ---------- */
window.addEventListener('keydown', function(e){
  if (state.view!=='thread' || state.tab!=='editor') return;
  var tag = e.target && e.target.tagName;
  if (tag==='INPUT' || tag==='TEXTAREA') return;
  if (state.l22==='typing') {
    if (e.key==='ArrowDown') { e.preventDefault(); state.complIdx = Math.min(5, state.complIdx+1); render(); }
    else if (e.key==='ArrowUp') { e.preventDefault(); state.complIdx = Math.max(0, state.complIdx-1); render(); }
    else if (e.key==='Enter' || e.key==='Tab') { e.preventDefault(); acceptCompl(); }
    else if (e.key==='Escape') { set({l22:'error'}); }
    return;
  }
  if (e.key==='Tab' && !state.ghostDone) { e.preventDefault(); acceptGhost(); }
  else if (e.key==='Escape') { set({peekOn:false, sigOn:false, hoverOn:false}); }
});

render();
</script>
</body>
